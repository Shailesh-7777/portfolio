<svg width="400" height="260" viewBox="0 0 400 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="certBg" x1="0" y1="0" x2="400" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F1322"/>
      <stop offset="1" stop-color="#080A10"/>
    </linearGradient>
    <linearGradient id="certBorder" x1="0" y1="0" x2="400" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#A855F7" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="badgeGlow" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="396" height="256" rx="16" fill="url(#certBg)" stroke="url(#certBorder)" stroke-width="2"/>
  
  <!-- Subtle Ornamental Corner Borders -->
  <path d="M 20 40 L 20 20 L 40 20" stroke="#06B6D4" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>
  <path d="M 380 40 L 380 20 L 360 20" stroke="#A855F7" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>
  <path d="M 20 220 L 20 240 L 40 240" stroke="#A855F7" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>
  <path d="M 380 220 L 380 240 L 360 240" stroke="#06B6D4" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>

  <!-- Centered Ribbon Badge -->
  <g transform="translate(170, 50)">
    <circle cx="30" cy="30" r="30" fill="url(#badgeGlow)" fill-opacity="0.15" stroke="url(#badgeGlow)" stroke-width="2"/>
    <path d="M 20 25 L 27 32 L 40 18" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 18 45 L 30 38 L 42 45 L 38 32" fill="#A855F7" fill-opacity="0.3" stroke="#A855F7" stroke-width="1.5"/>
  </g>

  <!-- Typography Placeholders -->
  <text x="200" y="145" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1">CERTIFICATE OF ACHIEVEMENT</text>
  <text x="200" y="170" text-anchor="middle" fill="#06B6D4" font-family="monospace" font-size="12" font-weight="500">VERIFIABLE CREDENTIAL SLOT</text>
  <text x="200" y="195" text-anchor="middle" fill="#8E9BAE" font-family="system-ui, sans-serif" font-size="11">Click Edit to upload image or update details</text>

  <!-- Status Chip -->
  <rect x="135" y="215" width="130" height="22" rx="11" fill="rgba(6,182,212,0.1)" stroke="rgba(6,182,212,0.3)" stroke-width="1"/>
  <circle cx="147" cy="226" r="3" fill="#10B981"/>
  <text x="156" y="230" fill="#D7E2EA" font-family="monospace" font-size="10">READY TO EDIT</text>
</svg>
